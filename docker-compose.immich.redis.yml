# Merged when Immich runs without shared Redis (useSidecarRedis=true).

services:
  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    networks:
      - modulab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${MODULAB_HOST_ROOT:-.}/data/immich/redis:/data

networks:
  modulab:
    external: true
    name: modulab
