# Modulab appliance — Control Center + state volume (no full repo clone).
#
# First-time install (full guide): README.md → "Install guide (first time)"
#
# Quick start:
#   mkdir -p "$HOME/modulab-data"
#   export MODULAB_HOST_ROOT="$HOME/modulab-data"   # absolute path required
#   curl -fsSL -o compose.yaml https://raw.githubusercontent.com/armanossiloko/modulab/master/compose.yaml
#   docker compose up -d
#   open http://localhost:8888 → Settings → Lab → set Host IP → Library
#
# Cloudflare tunnel (same file; hostname routes and Access stay in the dashboard):
#   Zero Trust → Networks → Tunnels → Cloudflared → name modulab-800-01
#   export CLOUDFLARE_TUNNEL_TOKEN='<token after --token>'
#   docker compose --profile cloudflare up -d
#   Public Hostname HTTP: home → http://127.0.0.1:8888
#   Same pattern for other apps (immich → :2283, jellyfin → :8096, …). Skip Postgres.
#   Access → Applications → Self-hosted → that hostname → one-time PIN
#
# Windows (PowerShell):
#   $env:MODULAB_HOST_ROOT = (Resolve-Path "$HOME\modulab-data").Path

name: modulab

services:
  control-center:
    image: ghcr.io/armanossiloko/modulab:${MODULAB_TAG:-latest}
    container_name: control-center
    restart: unless-stopped
    environment:
      MODULAB_ROOT: /lab
      MODULAB_KIT: /opt/modulab
      MODULAB_HOST_ROOT: ${MODULAB_HOST_ROOT:?Set MODULAB_HOST_ROOT to the absolute host path of your state directory}
      HOME_PORT: ${HOME_PORT:-8888}
      ASPNETCORE_URLS: http://0.0.0.0:8888
      CONTROL_CENTER_WWWROOT: /app/wwwroot
      DOTNET_gcServer: "0"
      DOTNET_EnableDiagnostics: "0"
      COMPOSE_PROJECT_NAME: modulab
      COMPOSE_IGNORE_ORPHANS: "true"
    ports:
      - "${MODULAB_PUBLISH_IP:-0.0.0.0}:${HOME_PORT:-8888}:8888"
    volumes:
      - ${MODULAB_HOST_ROOT}:/lab
      - /var/run/docker.sock:/var/run/docker.sock

  # Host network so the connector reaches app ports on 127.0.0.1.
  # Started only with: docker compose --profile cloudflare up -d
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
