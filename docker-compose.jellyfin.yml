services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    network_mode: "bridge"
    ports:
      - "${LAB_PUBLISH_IP:-0.0.0.0}:8096:8096"
      - "${LAB_PUBLISH_IP:-0.0.0.0}:8920:8920"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./media:/media
    environment:
      TZ: ${TZ:-UTC}
    restart: unless-stopped
