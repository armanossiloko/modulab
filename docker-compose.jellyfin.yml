services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    # Do not set user: 1000:1000 here — Docker Desktop (Windows/macOS) bind mounts
    # ignore Unix ownership and Jellyfin then crash-loops on /config. On Linux you can
    # add docker-compose.jellyfin.override.yml with user: "1000:1000" if desired.
    network_mode: "bridge"
    ports:
      - "${MODULAB_PUBLISH_IP:-0.0.0.0}:8096:8096"
      - "${MODULAB_PUBLISH_IP:-0.0.0.0}:8920:8920"
    volumes:
      - ${MODULAB_HOST_ROOT:-.}/data/jellyfin/config:/config
      - ${MODULAB_HOST_ROOT:-.}/data/jellyfin/cache:/cache
      - ${MODULAB_HOST_ROOT:-.}/media:/media
    environment:
      TZ: ${TZ:-UTC}
    restart: unless-stopped
