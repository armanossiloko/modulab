name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CRLF check (tracked scripts should be LF in git)
        run: |
          if grep -Il $'\r' scripts/*.sh; then
            echo "CRLF line endings found in scripts — use LF" >&2
            exit 1
          fi
      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py
          python3 scripts/update-appliance.py --self-check
      - name: Catalog
        run: python3 scripts/validate-catalog.py
      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: CRLF-safe runner
        run: |
          # Simulate a Windows working tree: convert scripts to CRLF, then run via lab.py
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("scripts").glob("*.sh"):
              data = p.read_bytes().replace(b"\n", b"\r\n")
              p.write_bytes(data)
          PY
          python3 scripts/lab.py check-deps
          cp lab.config.example.json lab.config.json
          python3 scripts/lab.py render-config
          test -f .env
          test -f postgres/bootstrap.sql
      - name: Compose config
        run: |
          docker compose version
          for f in docker-compose.*.yml; do
            case "$f" in
              *.override.yml|*.dns.yml|*.proxy-ports.yml|*.proxy-ports.desktop.yml|*.lan-ports.yml|*.dns-ports.yml|*.redis.yml) continue ;;
            esac
            echo "=== $f ==="
            docker compose --env-file .env -f "$f" config >/dev/null
          done
          echo "=== docker-compose.immich.yml + immich.redis overlay ==="
          docker compose --env-file .env -f docker-compose.immich.yml -f docker-compose.immich.redis.yml config >/dev/null
          echo "=== compose.yaml (appliance bootstrap) ==="
          mkdir -p /tmp/modulab-data
          MODULAB_HOST_ROOT=/tmp/modulab-data docker compose -f compose.yaml config >/dev/null
          MODULAB_HOST_ROOT=/tmp/modulab-data CLOUDFLARE_TUNNEL_TOKEN=ci docker compose -f compose.yaml --profile cloudflare config >/dev/null
          python3 -m py_compile scripts/seed-lab-state.py
          python3 scripts/seed-lab-state.py
        env:
          MODULAB_ROOT: /tmp/modulab-seed-test
          MODULAB_KIT: ${{ github.workspace }}
          MODULAB_SEED: "true"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test control-center/tests/Modulab.ControlCenter.Tests/Modulab.ControlCenter.Tests.csproj
      - name: Native AOT toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang zlib1g-dev
      - name: Native AOT publish
        # The image ships a Native AOT binary; fail on trim/AOT warnings here instead of at runtime.
        run: >
          dotnet publish control-center/src-backend/Modulab.ControlCenter/Modulab.ControlCenter.csproj
          -c Release -r linux-x64 -p:PublishAot=true -p:OpenApiGenerateDocuments=false
          -p:OpenApiGenerateDocumentsOnBuild=false -warnaserror:IL2026,IL3050,IL2104,IL3053
          -o /tmp/aot

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
