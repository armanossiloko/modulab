name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CRLF check
        run: |
          if grep -Il $'\r' scripts/*.sh; then
            echo "CRLF line endings found in scripts — use LF" >&2
            exit 1
          fi
      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Render config from example
        run: |
          cp lab.config.example.json lab.config.json
          bash scripts/render-config.sh
          test -f .env
          test -f postgres/bootstrap.sql
      - name: Compose config
        run: |
          docker compose version
          for f in docker-compose.*.yml; do
            case "$f" in
              *.override.yml|*.dns.yml|*.proxy-ports.yml|*.lan-ports.yml|*.dns-ports.yml) continue ;;
            esac
            echo "=== $f ==="
            docker compose --env-file .env -f "$f" config >/dev/null
          done
