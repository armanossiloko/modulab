# Control Center — UI + API in one directory (Native AOT .NET 10).
# Open http://127.0.0.1:8888 or http://<LAB_HOST_IP>:8888 when published on LAN.

services:
  control-center:
    container_name: control-center
    build:
      context: .
      dockerfile: control-center/Dockerfile
    restart: unless-stopped
    environment:
      LAB_ROOT: /lab
      HOME_PORT: ${HOME_PORT:-8888}
      ASPNETCORE_URLS: http://0.0.0.0:8888
      CONTROL_CENTER_WWWROOT: /lab/control-center/wwwroot
      CONTROL_CENTER_ANGULAR_DIST: /lab/control-center/dist/control-center/browser
      DOTNET_gcServer: "0"
      DOTNET_EnableDiagnostics: "0"
    ports:
      - "${LAB_PUBLISH_IP:-0.0.0.0}:${HOME_PORT:-8888}:8888"
    volumes:
      - ./:/lab
      - /var/run/docker.sock:/var/run/docker.sock
