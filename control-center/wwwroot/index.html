<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modulab · Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Shortcuts">
      <a class="brand" href="/" aria-label="Modulab home">
        <span class="brand-orb" aria-hidden="true"></span>
        <span class="brand-name" id="brand-name">Modulab</span>
      </a>
      <nav class="nav-pages" aria-label="Main">
        <a class="page-tab is-active" href="/" data-view="home">Home</a>
        <a class="page-tab" href="/library" data-view="library">Library</a>
        <a class="page-tab" href="/settings" data-view="settings">Settings</a>
      </nav>
      <div id="sidebar-categories" class="bookmark-groups"></div>
      <div class="sidebar-actions">
        <button type="button" class="sidebar-import-btn" id="edit-shortcuts-btn">Edit shortcuts</button>
        <button type="button" class="sidebar-import-btn sidebar-import-btn--quiet" id="import-bookmarks-btn">Import…</button>
      </div>
      <p class="sidebar-foot" id="rail-foot">—</p>
    </aside>
    <div
      class="sidebar-resizer"
      id="sidebar-resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize sidebar"
      tabindex="0"
    ></div>

    <div class="page">
      <header class="search-row">
        <label class="search-wrap">
          <span class="sr-only">Search</span>
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input type="search" id="search" class="search" placeholder="Search stacks or the web…" autocomplete="off" spellcheck="false">
        </label>
        <button type="button" id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
        </button>
      </header>

      <div class="page-body">
        <main class="center" id="center-widgets"></main>

        <aside class="rail-right" id="right-rail" aria-label="Status"></aside>
      </div>
    </div>
  </div>

  <div id="install-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-install-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="install-title">
      <div class="modal-head">
        <h2 id="install-title">Install</h2>
        <button type="button" class="icon-btn" data-close-install-modal aria-label="Close">×</button>
      </div>
      <p id="install-desc" class="widget-caption"></p>
      <form id="install-form" class="install-form"></form>
      <p id="install-error" class="install-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" data-close-install-modal>Cancel</button>
        <button type="submit" form="install-form" class="btn btn--primary" id="install-submit">Install</button>
      </div>
    </div>
  </div>

  <div id="bookmark-import-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-bookmark-modal></div>
    <div class="modal-card modal-card--wide" role="dialog" aria-modal="true" aria-labelledby="bookmark-import-title">
      <div class="modal-head">
        <h2 id="bookmark-import-title">Import bookmarks</h2>
        <button type="button" class="icon-btn" data-close-bookmark-modal aria-label="Close">×</button>
      </div>
      <p class="widget-caption">
        Browsers can’t share bookmarks with web apps. Export a bookmarks HTML file
        (Chrome: Bookmark manager → ⋮ → Export; Firefox: Library → Import and Backup → Export),
        then pick which links become sidebar shortcuts.
      </p>
      <label class="bookmark-file-label">
        <span>Bookmarks HTML</span>
        <input type="file" id="bookmark-file" accept=".html,.htm,text/html">
      </label>
      <div class="bookmark-import-toolbar" hidden id="bookmark-import-toolbar">
        <button type="button" class="btn btn--ghost btn--sm" id="bookmark-select-all">Select all</button>
        <button type="button" class="btn btn--ghost btn--sm" id="bookmark-select-none">Select none</button>
        <span class="bookmark-selection-count" id="bookmark-selection-count"></span>
      </div>
      <div class="bookmark-tree" id="bookmark-tree" hidden></div>
      <div class="bookmark-import-options" id="bookmark-import-options" hidden>
        <label class="install-field">
          <span>Grouping</span>
          <select id="bookmark-group-mode">
            <option value="folders">Keep folders as groups</option>
            <option value="flat">Single group</option>
          </select>
        </label>
        <label class="install-field" id="bookmark-flat-name-wrap" hidden>
          <span>Group title</span>
          <input type="text" id="bookmark-flat-name" value="Imported" maxlength="64">
        </label>
        <label class="install-field">
          <span>Color</span>
          <input type="color" id="bookmark-group-color" value="#39b98a">
        </label>
        <label class="bookmark-check-option">
          <input type="checkbox" id="bookmark-merge" checked>
          <span>Merge into existing groups with the same title</span>
        </label>
      </div>
      <p id="bookmark-import-error" class="install-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" data-close-bookmark-modal>Cancel</button>
        <button type="button" class="btn btn--primary" id="bookmark-import-submit" disabled>Import selected</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
