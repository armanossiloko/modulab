<div class="shell">
  <app-sidebar />

  <div
    class="sidebar-resizer"
    role="separator"
    aria-orientation="vertical"
    aria-label="Resize sidebar"
    tabindex="0"
    (pointerdown)="startResize($event)"
  ></div>

  <div class="page">
    <header class="topbar">
      <button type="button" class="search search-launch" (click)="paletteOpen.set(true)">
        <app-icon name="search" />
        <span>{{ searchPlaceholder() }}</span>
        <kbd class="search-kbd" aria-hidden="true">{{ shortcutLabel }}</kbd>
      </button>
      <button
        type="button"
        class="icon-btn icon-btn--lg"
        [class.is-spinning]="refreshing()"
        title="Refresh"
        aria-label="Refresh"
        (click)="refresh()"
      >
        <app-icon name="refresh" />
      </button>
    </header>

    <div class="page-body">
      @if (needsLabSetup()) {
        <p class="banner setup-banner" role="status">
          <app-icon name="info" />
          <span>
            Finish setup: set your LAN host IP in
            <a routerLink="/settings/lab">Settings → Lab</a>
            before installing apps.
          </span>
        </p>
      }
      <router-outlet />
    </div>
  </div>
</div>

@if (paletteOpen()) {
  <app-command-palette (closed)="paletteOpen.set(false)" />
}
