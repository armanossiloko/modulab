# https://github.com/mtlynch/picoshare

services:
  picoshare:
    image: mtlynch/picoshare:latest
    container_name: picoshare
    ports:
      - "${PORT:-4001}:${PORT:-4001}/tcp"
    command: -db /data/store.db
    volumes:
      - ./data/picoshare:/data
    environment:
      - PORT=${PORT:-4001}
      - PS_SHARED_SECRET=${PS_SHARED_SECRET:?Set PS_SHARED_SECRET in .env.picoshare}
      - PS_BEHIND_PROXY=${PS_BEHIND_PROXY:-false}
    env_file:
      - .env.picoshare
    restart: unless-stopped
