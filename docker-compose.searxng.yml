# SearXNG — private metasearch (html + json; secret seeded on first boot).
services:
  searxng:
    # Pinned: some :latest tags have broken on boot (e.g. KeyError default_doi_resolver).
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${MODULAB_PUBLISH_IP:-0.0.0.0}:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ${MODULAB_HOST_ROOT:-.}/data/searxng:/etc/searxng
      - ${MODULAB_HOST_ROOT:-.}/searxng/settings.yml.template:/tmp/searxng-settings.yml.template:ro
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        tmpl=/tmp/searxng-settings.yml.template
        # Docker Desktop creates a *directory* when the host bind path is missing —
        # that yields an empty settings.yml and KeyError: default_doi_resolver.
        if [ ! -f "$$tmpl" ]; then
          echo "searxng: settings template missing or not a file: $$tmpl" >&2
          echo "searxng: check MODULAB_HOST_ROOT and recreate the container" >&2
          ls -la /tmp /etc/searxng >&2 || true
          exit 1
        fi
        if [ ! -s /etc/searxng/settings.yml ] || grep -q '__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(head -c 48 /dev/urandom | base64 | tr -d '/+=' | head -c 48)"
          fi
          # Strip CR so Windows-checked-out templates do not break YAML.
          sed "s|__SEARXNG_SECRET__|$$secret|g" "$$tmpl" | tr -d '\r' > /etc/searxng/settings.yml
        fi
        if [ ! -s /etc/searxng/settings.yml ]; then
          echo "searxng: failed to seed /etc/searxng/settings.yml" >&2
          exit 1
        fi
        exec /usr/local/searxng/entrypoint.sh
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
