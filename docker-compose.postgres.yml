# Shared Postgres for the whole lab — only one Postgres container.
# Uses Immich's vector/pgvectors image so Immich and other apps share the same instance
# (separate databases). Hostname on Docker network "modulab": postgres
# Host: 127.0.0.1:5432
# Edit lab.config.json only — .env is generated.

services:
  postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modulab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modulab}
      POSTGRES_DB: ${POSTGRES_DB:-modulab}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${MODULAB_HOST_ROOT:-.}/data/postgres:/var/lib/postgresql/data
      - ${MODULAB_HOST_ROOT:-.}/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - modulab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    shm_size: 128mb

  db-bootstrap:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - modulab
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-modulab}
    volumes:
      - ${MODULAB_HOST_ROOT:-.}/postgres/bootstrap.sql:/bootstrap.sql:ro
    entrypoint:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-modulab}
      - -v
      - ON_ERROR_STOP=0
      - -f
      - /bootstrap.sql
    restart: "no"

networks:
  modulab:
    external: true
    name: modulab
