# Pi-hole — DNS hosts come from generated docker-compose.pihole.dns.yml
# Set lab.hostIp + lab.domain in lab.config.json

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:${PIHOLE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAM_DNS:-1.1.1.1;1.0.0.1}
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:5080:80/tcp"
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_TIME
    healthcheck:
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
