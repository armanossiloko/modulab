# Immich — photos/videos on shared Postgres; Redis shared or sidecar.
# Install starts postgres via recipe dependsOn. Redis: prefer shared stack, else
# docker-compose.immich.redis.yml (see useSidecarRedis / REDIS_HOSTNAME).

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Absolute host path from render-config (MODULAB_HOST_ROOT + data/immich/library).
      - ${UPLOAD_LOCATION}:/data
    environment:
      IMMICH_VERSION: ${IMMICH_VERSION:-release}
      DB_HOSTNAME: postgres
      DB_USERNAME: ${POSTGRES_USER:-modulab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-modulab}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:-immich}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME:-redis}
      TZ: ${TZ:-UTC}
    ports:
      - "${MODULAB_PUBLISH_IP:-0.0.0.0}:2283:2283"
    networks:
      - modulab
    depends_on: []
    restart: unless-stopped
    healthcheck:
      disable: false

  # Optional ML (higher RAM). Uncomment when needed.
  # immich-machine-learning:
  #   container_name: immich_machine_learning
  #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
  #   volumes:
  #     - ./data/immich/model-cache:/cache
  #   environment:
  #     IMMICH_VERSION: ${IMMICH_VERSION:-release}
  #   networks:
  #     - modulab
  #   restart: unless-stopped

networks:
  modulab:
    external: true
    name: modulab
