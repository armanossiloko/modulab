# Immich — uses shared Postgres + Redis on network "modulab" (no nested DB/cache).
# Install starts postgres + redis first via recipe dependsOn.
# UI: http://127.0.0.1:2283

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION:-./data/immich/library}:/data
    environment:
      IMMICH_VERSION: ${IMMICH_VERSION:-release}
      DB_HOSTNAME: postgres
      DB_USERNAME: ${POSTGRES_USER:-modulab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-modulab}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:-immich}
      REDIS_HOSTNAME: redis
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:2283:2283"
    networks:
      - modulab
    depends_on: []
    restart: unless-stopped
    healthcheck:
      disable: false

  # Optional ML (higher RAM). Uncomment when needed.
  # immich-machine-learning:
  #   container_name: immich_machine_learning
  #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
  #   volumes:
  #     - ./data/immich/model-cache:/cache
  #   environment:
  #     IMMICH_VERSION: ${IMMICH_VERSION:-release}
  #   networks:
  #     - modulab
  #   restart: unless-stopped

networks:
  modulab:
    external: true
    name: modulab
