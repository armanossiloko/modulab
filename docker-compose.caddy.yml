# Optional LAN reverse proxy only (network.lan). Control Center serves the home UI.

services:
  caddy:
    container_name: caddy
    image: caddy:${CADDY_TAG:-2-alpine}
    restart: unless-stopped
    environment:
      LOCAL_DOMAIN: ${PIHOLE_LOCAL_DOMAIN:-network.lan}
      ENABLE_LAN_PROXY: ${ENABLE_LAN_PROXY:-false}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-127.0.0.1}
      HOME_PORT: ${HOME_PORT:-8888}
    command:
      - sh
      - -c
      - |
        if [ "$${ENABLE_LAN_PROXY}" = "true" ]; then
          cat /etc/caddy/Caddyfile /etc/caddy/proxy.caddy > /tmp/Caddyfile
          exec caddy run --config /tmp/Caddyfile
        else
          echo "LAN proxy disabled — use Control Center for the home UI."
          sleep infinity
        fi
    volumes:
      - ${MODULAB_HOST_ROOT:-.}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MODULAB_HOST_ROOT:-.}/caddy/proxy.caddy:/etc/caddy/proxy.caddy:ro
      - ${MODULAB_HOST_ROOT:-.}/data/caddy/data:/data
      - ${MODULAB_HOST_ROOT:-.}/data/caddy/config:/config
